name: Fábrica de publicaciones MI MAPA

on:
  schedule:
    # 09:07 de Ciudad de México (UTC-6), fuera del pico de la hora en punto
    - cron: '7 15 * * *'
    # 20:07 de Ciudad de México: domingo, lunes, miércoles, viernes y sábado
    - cron: '7 2 * * 0,1,2,4,6'
  workflow_dispatch:
    inputs:
      format:
        description: Serie que quieres publicar
        required: true
        type: choice
        options: [hoy, centro, animal, semana-a, semana-b]

permissions:
  contents: write

concurrency:
  group: fabrica-social
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar conexión con Instagram
        id: connection
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -n "$IG_USER_ID" ] && [ -n "$IG_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Conexión disponible."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "La fábrica está en pausa hasta guardar IG_USER_ID e IG_ACCESS_TOKEN."
          fi

      - uses: actions/checkout@v4
        if: steps.connection.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.connection.outputs.ready == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.connection.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Preparar generador
        if: steps.connection.outputs.ready == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-prod sharp@0.34.4
      - name: Elegir serie
        if: steps.connection.outputs.ready == 'true'
        id: format
        env:
          MANUAL_FORMAT: ${{ inputs.format }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          FORMAT="$MANUAL_FORMAT"
          IS_EVENING='false'
          if [ -z "$FORMAT" ]; then
            case "$SCHEDULE" in
              '7 15 * * *') FORMAT='hoy' ;;
              '7 2 * * 0,1,2,4,6')
                IS_EVENING='true'
                STATE_FILE='public/social/state/last-evening-series.txt'
                LAST=''
                if [ -f "$STATE_FILE" ]; then
                  LAST="$(tr -d '\r\n' < "$STATE_FILE")"
                fi
                SERIES=(centro animal semana-a semana-b)
                AVAILABLE=()
                for candidate in "${SERIES[@]}"; do
                  if [ "$candidate" != "$LAST" ]; then
                    AVAILABLE+=("$candidate")
                  fi
                done
                FORMAT="$(printf '%s\n' "${AVAILABLE[@]}" | shuf -n 1)"
                echo "Serie nocturna anterior: ${LAST:-ninguna}"
                ;;
              *)
                echo "Horario automático desconocido: $SCHEDULE"
                exit 1
                ;;
            esac
          fi
          echo "value=$FORMAT" >> "$GITHUB_OUTPUT"
          echo "is_evening=$IS_EVENING" >> "$GITHUB_OUTPUT"
          echo "Serie elegida: $FORMAT"
      - name: Generar imágenes
        if: steps.connection.outputs.ready == 'true'
        env:
          FORMAT: ${{ steps.format.outputs.value }}
        run: |
          node scripts/generate-social.mjs "$FORMAT"
          node --input-type=module <<'NODE'
          import sharp from 'sharp'
          import { readdir } from 'node:fs/promises'
          const dir='public/social/generated'
          for(const file of await readdir(dir)){
            if(!file.endsWith('.svg'))continue
            await sharp(`${dir}/${file}`).jpeg({quality:92,chromaSubsampling:'4:4:4'}).toFile(`${dir}/${file.replace('.svg','.jpg')}`)
          }
          NODE
      - name: Guardar recursos públicos
        if: steps.connection.outputs.ready == 'true'
        run: |
          git config user.name "mi-mapa-bot"
          git config user.email "actions@github.com"
          git add public/social/generated
          if git diff --cached --quiet; then
            echo "La pieza de hoy ya estaba generada."
          else
            git commit -m "content: ${{ steps.format.outputs.value }} $(date -u +%F)"
          fi
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Dar tiempo al recurso público
        if: steps.connection.outputs.ready == 'true'
        run: sleep 12
      - name: Publicar en Instagram
        if: steps.connection.outputs.ready == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v23.0' }}
        run: |
          META='public/social/generated/post.json'
          CAPTION="$(jq -r .caption "$META")"
          COUNT="$(jq '.items | length' "$META")"
          BASE="https://raw.githubusercontent.com/Ebermed/mi-mapa/$sha/public/social/generated"
          GRAPH="https://graph.instagram.com/$GRAPH_VERSION"
          wait_for_container() {
            local id="$1"
            local response status
            for attempt in $(seq 1 24); do
              response="$(curl --fail-with-body -sS "$GRAPH/$id" --get --data-urlencode 'fields=status_code,status' --data-urlencode "access_token=$IG_ACCESS_TOKEN")"
              status="$(jq -r '.status_code // empty' <<< "$response")"
              case "$status" in
                FINISHED)
                  echo "El contenedor $id está listo."
                  return 0
                  ;;
                ERROR|EXPIRED)
                  echo "Instagram reportó un problema al preparar el contenedor $id:"
                  echo "$response"
                  return 1
                  ;;
              esac
              echo "Preparando contenedor $id ($attempt/24): ${status:-procesando}"
              sleep 5
            done
            echo "El contenedor $id superó el tiempo de preparación."
            return 1
          }
          ACCOUNT="$(curl --fail-with-body -sS "$GRAPH/$IG_USER_ID" --get --data-urlencode 'fields=id,username' --data-urlencode "access_token=$IG_ACCESS_TOKEN")"
          echo "Publicando en @$(jq -r .username <<< "$ACCOUNT")"
          if [ "$COUNT" -eq 1 ]; then
            FILE="$(jq -r '.items[0]' "$META")"
            RESPONSE="$(curl --fail-with-body -sS -X POST "$GRAPH/$IG_USER_ID/media" --data-urlencode "image_url=$BASE/$FILE" --data-urlencode "caption=$CAPTION" --data-urlencode "access_token=$IG_ACCESS_TOKEN")"
            CREATION_ID="$(jq -r .id <<< "$RESPONSE")"
            wait_for_container "$CREATION_ID"
          else
            CHILDREN=''
            while IFS= read -r FILE; do
              RESPONSE="$(curl --fail-with-body -sS -X POST "$GRAPH/$IG_USER_ID/media" --data-urlencode "image_url=$BASE/$FILE" --data-urlencode "is_carousel_item=true" --data-urlencode "access_token=$IG_ACCESS_TOKEN")"
              ID="$(jq -r .id <<< "$RESPONSE")"
              wait_for_container "$ID"
              CHILDREN="${CHILDREN:+$CHILDREN,}$ID"
            done < <(jq -r '.items[]' "$META")
            RESPONSE="$(curl --fail-with-body -sS -X POST "$GRAPH/$IG_USER_ID/media" --data-urlencode "media_type=CAROUSEL" --data-urlencode "children=$CHILDREN" --data-urlencode "caption=$CAPTION" --data-urlencode "access_token=$IG_ACCESS_TOKEN")"
            CREATION_ID="$(jq -r .id <<< "$RESPONSE")"
            wait_for_container "$CREATION_ID"
          fi
          curl --fail-with-body -sS -X POST "$GRAPH/$IG_USER_ID/media_publish" --data-urlencode "creation_id=$CREATION_ID" --data-urlencode "access_token=$IG_ACCESS_TOKEN"
      - name: Publicar también en Facebook
        if: steps.connection.outputs.ready == 'true'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v23.0' }}
        run: |
          if [ -z "$FB_PAGE_ID" ] || [ -z "$FB_PAGE_ACCESS_TOKEN" ]; then
            echo "Facebook queda en espera hasta guardar FB_PAGE_ID y FB_PAGE_ACCESS_TOKEN."
            exit 0
          fi
          META='public/social/generated/post.json'
          CAPTION="$(jq -r .caption "$META")"
          COUNT="$(jq '.items | length' "$META")"
          BASE="https://raw.githubusercontent.com/Ebermed/mi-mapa/$sha/public/social/generated"
          GRAPH="https://graph.facebook.com/$GRAPH_VERSION"
          PAGE="$(curl --fail-with-body -sS "$GRAPH/$FB_PAGE_ID" --get --data-urlencode 'fields=id,name' --data-urlencode "access_token=$FB_PAGE_ACCESS_TOKEN")"
          echo "Publicando en Facebook: $(jq -r .name <<< "$PAGE")"
          if [ "$COUNT" -eq 1 ]; then
            FILE="$(jq -r '.items[0]' "$META")"
            curl --fail-with-body -sS -X POST "$GRAPH/$FB_PAGE_ID/photos" --data-urlencode "url=$BASE/$FILE" --data-urlencode "message=$CAPTION" --data-urlencode "access_token=$FB_PAGE_ACCESS_TOKEN"
          else
            ATTACHED_MEDIA=()
            INDEX=0
            while IFS= read -r FILE; do
              RESPONSE="$(curl --fail-with-body -sS -X POST "$GRAPH/$FB_PAGE_ID/photos" --data-urlencode "url=$BASE/$FILE" --data-urlencode 'published=false' --data-urlencode "access_token=$FB_PAGE_ACCESS_TOKEN")"
              MEDIA_ID="$(jq -r .id <<< "$RESPONSE")"
              ATTACHED_MEDIA+=(--data-urlencode "attached_media[$INDEX]={\"media_fbid\":\"$MEDIA_ID\"}")
              INDEX=$((INDEX + 1))
            done < <(jq -r '.items[]' "$META")
            curl --fail-with-body -sS -X POST "$GRAPH/$FB_PAGE_ID/feed" --data-urlencode "message=$CAPTION" "${ATTACHED_MEDIA[@]}" --data-urlencode "access_token=$FB_PAGE_ACCESS_TOKEN"
          fi
      - name: Recordar última serie nocturna
        if: steps.connection.outputs.ready == 'true' && steps.format.outputs.is_evening == 'true'
        run: |
          mkdir -p public/social/state
          printf '%s\n' "${{ steps.format.outputs.value }}" > public/social/state/last-evening-series.txt
          git add public/social/state/last-evening-series.txt
          if git diff --cached --quiet; then
            echo "La serie nocturna ya estaba registrada."
          else
            git commit -m "state: recordar serie nocturna ${{ steps.format.outputs.value }}"
            git push
          fi
